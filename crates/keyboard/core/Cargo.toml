[package]
name = "hex-keyboard-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hex_keyboard_core"

[dependencies]
# Swift's `caseInsensitiveCompare` (full case folding) and `Character`s (grapheme clusters),
# which autocorrect reads words by.
caseless = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
# The parity fixtures and the replay benchmark's sets are JSON Lines.
serde_json = "1"

[lints]
workspace = true
